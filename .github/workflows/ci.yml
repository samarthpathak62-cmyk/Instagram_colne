name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: git ls-files -z -- '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Run Flutter analyzer
        # Keep analyzer errors and warnings fatal while legacy info-level lints are addressed.
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub

  build-android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build web release
        run: flutter build web --release --no-pub

      - name: Smoke-test Veyro in desktop and mobile Chrome
        env:
          VEYRO_SCREENSHOTS: ${{ runner.temp }}/veyro-web-screenshots
        run: |
          npm install --quiet --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/veyro-browser" playwright-core@1.61.1
          python3 -m http.server 3000 --bind 127.0.0.1 --directory build/web > "$RUNNER_TEMP/veyro-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:3000/ -o /dev/null
          NODE_PATH="$RUNNER_TEMP/veyro-browser/node_modules" node tool/smoke_veyro_web.cjs

      - name: Upload browser screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: veyro-browser-screenshots
          path: ${{ runner.temp }}/veyro-web-screenshots
          if-no-files-found: ignore

      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: web-release
          path: build/web
          if-no-files-found: error
