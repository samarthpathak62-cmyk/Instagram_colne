name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: git ls-files -z -- '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Run Flutter analyzer
        # Keep analyzer errors and warnings fatal while legacy info-level lints are addressed.
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/veyro-analyze.log" || {
            grep -E '^[[:space:]]*(error|warning) (•|-)' "$RUNNER_TEMP/veyro-analyze.log" | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit 1
          }

      - name: Run Flutter tests
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee "$RUNNER_TEMP/veyro-test.log" || {
            tail -n 25 "$RUNNER_TEMP/veyro-test.log" | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            exit 1
          }

  build-android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build web release
        run: flutter build web --release --no-pub --source-maps

      - name: Verify live Veyro REST and Auth
        run: |
          set -o pipefail
          python3 -u tool/check_veyro.py 2>&1 | tee "$RUNNER_TEMP/veyro-smoke.log" || {
            tail -n 1 "$RUNNER_TEMP/veyro-smoke.log" | sed 's/^/::error::/'
            exit 1
          }
          tail -n 1 "$RUNNER_TEMP/veyro-smoke.log" | sed 's/^/::notice::/'

      - name: Smoke-test the compiled website in Chrome
        run: |
          npm install --quiet --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/veyro-browser" playwright-core source-map
          python3 -m http.server 3000 --bind 127.0.0.1 --directory build/web > "$RUNNER_TEMP/veyro-http.log" 2>&1 &
          trap 'kill $!' EXIT
          node <<'JS'
          const fs = require('node:fs');
          const deps = `${process.env.RUNNER_TEMP}/veyro-browser/node_modules`;
          const { chromium } = require(`${deps}/playwright-core`);
          const { SourceMapConsumer } = require(`${deps}/source-map`);
          const config = fs.readFileSync('lib/core/constants/supabase_constants.dart', 'utf8');
          const url = config.match(/supabaseUrl\s*=\s*'([^']+)'/)[1];
          const key = config.match(/supabasePublishableKey\s*=\s*'(sb_publishable_[^']+)'/)[1];
          (async () => {
            const browser = await chromium.launch({ executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] });
            try {
              const page = await browser.newPage();
              const errors = [];
              const details = [];
              page.on('pageerror', error => errors.push(error.stack || error.message));
              page.on('console', message => {
                if (['error', 'warning'].includes(message.type())) details.push(message.text());
              });
              page.on('response', response => {
                if (response.status() >= 400) details.push(`${response.status()} ${new URL(response.url()).pathname}`);
              });
              await page.goto('http://localhost:3000/');
              const view = page.locator('flutter-view');
              await view.waitFor({ timeout: 30000 });
              const placeholder = page.locator('flt-semantics-placeholder');
              await placeholder.first().evaluate(node => node.click(), { timeout: 10000 }).catch(() => {});
              const loginVisible = await page.getByRole('button', { name: 'Log In', exact: true })
                .first().waitFor({ state: 'attached', timeout: 10000 }).then(() => true, () => false);
              const status = await page.evaluate(async ({ url, key }) => {
                const response = await fetch(`${url}/auth/v1/settings`, {
                  headers: { apikey: key, Authorization: `Bearer ${key}` },
                });
                return response.status;
              }, { url, key });
              if (status !== 200 || errors.length || !loginVisible) {
                const sourceMapPath = 'build/web/main.dart.js.map';
                if (fs.existsSync(sourceMapPath)) {
                  await SourceMapConsumer.with(fs.readFileSync(sourceMapPath, 'utf8'), null, map => {
                    for (const stack of errors) {
                      for (const loc of [...stack.matchAll(/main\.dart\.js:(\d+):(\d+)/g)].slice(0, 30)) {
                        const original = map.originalPositionFor({ line: Number(loc[1]), column: Number(loc[2])-1 });
                        details.push(`Stack: ${original.source}:${original.line}:${original.column} ${original.name || ''}`);
                      }
                    }
                  });
                }
                for (const line of [...errors, ...details].join('\n').split('\n').slice(0, 70)) {
                  console.error(`::warning::${line.replace(key, '[publishable-key]').slice(0, 1000)}`);
                }
                throw Error(`Compiled page: Veyro HTTP ${status}; errors=${errors.length}; login=${loginVisible}`);
              }
              console.log('::notice::Flutter Web booted in Chrome and reached Veyro Auth from the browser.');
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(`::error::${error.message}`);
            process.exitCode = 1;
          });
          JS

      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: web-release
          path: build/web
          if-no-files-found: error
