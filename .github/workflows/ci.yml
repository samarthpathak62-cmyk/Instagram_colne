name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check Dart formatting
        run: git ls-files -z -- '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Run Flutter analyzer
        # Keep analyzer errors and warnings fatal while legacy info-level lints are addressed.
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        run: |
          set -o pipefail
          if ! flutter test --no-pub --reporter expanded 2>&1 | tee "$RUNNER_TEMP/veyro-test.log"; then
            python3 - "$RUNNER_TEMP/veyro-test.log" <<'PYTHON'
          import pathlib
          import sys
          text = pathlib.Path(sys.argv[1]).read_text()
          text = text[-7500:]
          for start in range(0, len(text), 2400):
              message = text[start:start+2400].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=Flutter tests::' + message)
          PYTHON
            exit 1
          fi

      - name: Test the social migration in isolated Postgres
        run: |
          npm install --quiet --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/veyro-sql" @electric-sql/pglite@0.5.16
          NODE_PATH="$RUNNER_TEMP/veyro-sql/node_modules" node tool/test_social_schema.cjs

  test-postgrest:
    name: Live API contract in PostgREST
    runs-on: ubuntu-latest
    env:
      VEYRO_TEST_JWT_SECRET: local-only-veyro-postgrest-fixture-secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: veyro-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify installed APK, Following and post shares against PostgREST
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          psql_ci() { docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 "$@"; }
          psql_ci < test/fixtures/veyro_social_schema.sql
          for migration in supabase/migrations/*; do
            [[ "$migration" == *_connect_veyro_clients.sql ]] && continue
            psql_ci --single-transaction < "$migration"
          done
          psql_ci < test/fixtures/veyro_rest_seed.sql
          psql_ci <<'SQL'
          create role authenticator noinherit login password 'veyro-api';
          grant anon, authenticated to authenticator;
          SQL
          docker run -d --name veyro-rest --network host \
            -e PGRST_DB_URI=postgres://authenticator:veyro-api@127.0.0.1:5432/postgres \
            -e PGRST_DB_ANON_ROLE=anon -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_AGGREGATES_ENABLED=true -e PGRST_JWT_SECRET="$VEYRO_TEST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3100 -e PGRST_ADMIN_SERVER_PORT=3101 \
            postgrest/postgrest:v14.13
          trap 'docker logs veyro-rest && docker rm -f veyro-rest' EXIT
          curl --fail --retry 15 --retry-delay 1 --retry-connrefused http://127.0.0.1:3101/ready
          node tool/test_veyro_postgrest.cjs

  build-android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build web release
        run: flutter build web --release --no-pub

      - name: Smoke-test Veyro in desktop and mobile Chrome
        env:
          VEYRO_SCREENSHOTS: ${{ runner.temp }}/veyro-web-screenshots
          VEYRO_TEST_REEL: test/fixtures/veyro-synthetic-reel.webm
        run: |
          npm install --quiet --no-audit --no-fund --no-save --prefix "$RUNNER_TEMP/veyro-browser" playwright-core@1.61.1
          python3 -m http.server 3000 --bind 127.0.0.1 --directory build/web > "$RUNNER_TEMP/veyro-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-connrefused http://127.0.0.1:3000/ -o /dev/null
          NODE_PATH="$RUNNER_TEMP/veyro-browser/node_modules" node tool/smoke_veyro_web.cjs

      - name: Upload browser screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: veyro-browser-screenshots
          path: ${{ runner.temp }}/veyro-web-screenshots
          if-no-files-found: ignore

      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: web-release
          path: build/web
          if-no-files-found: error
