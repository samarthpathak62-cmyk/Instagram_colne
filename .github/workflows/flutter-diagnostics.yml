name: Flutter repair diagnostics

on:
  push:
    branches: [arena/26108c72-instagram-colne]

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Diagnose dependency resolution and analysis
        shell: bash
        run: |
          publish() {
            local title="$1"
            local chunk=0
            while IFS= read -r line; do
              printf '::notice title=%s %04d::%s\n' "$title" "$chunk" "$line"
              chunk=$((chunk + 1))
            done < <(gzip -c | base64 -w0 | fold -w 3500 | awk '1')
          }
          if ! flutter pub get --enforce-lockfile > "$RUNNER_TEMP/pub.log" 2>&1; then
            cat "$RUNNER_TEMP/pub.log"
            publish pub-log < "$RUNNER_TEMP/pub.log"
            exit 1
          fi
          if ! flutter analyze --no-pub --no-fatal-infos > "$RUNNER_TEMP/analyze.log" 2>&1; then
            cat "$RUNNER_TEMP/analyze.log"
            grep -v 'info •' "$RUNNER_TEMP/analyze.log" | publish analyze-issues
            exit 1
          fi
