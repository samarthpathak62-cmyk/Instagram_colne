name: Android release

on:
  workflow_dispatch:
  push:
    branches: [arena/26108c72-instagram-colne]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Android release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run analyzer
        # Keep analyzer errors and warnings fatal while legacy info-level lints are addressed.
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Build release APK
        shell: bash
        run: |
          if flutter build apk --release --no-pub > "$RUNNER_TEMP/gradle-build.log" 2>&1; then
            cat "$RUNNER_TEMP/gradle-build.log"
          else
            cat "$RUNNER_TEMP/gradle-build.log"
            chunk=0
            while IFS= read -r line; do
              printf '::notice title=gradle-log %04d::%s\n' "$chunk" "$line"
              chunk=$((chunk + 1))
            done < <(tail -n 250 "$RUNNER_TEMP/gradle-build.log" | gzip -c | base64 -w0 | fold -w 3500 | awk '1')
            exit 1
          fi

      - name: Build release App Bundle
        shell: bash
        run: |
          if flutter build appbundle --release --no-pub > "$RUNNER_TEMP/gradle-build.log" 2>&1; then
            cat "$RUNNER_TEMP/gradle-build.log"
          else
            cat "$RUNNER_TEMP/gradle-build.log"
            chunk=0
            while IFS= read -r line; do
              printf '::notice title=gradle-log %04d::%s\n' "$chunk" "$line"
              chunk=$((chunk + 1))
            done < <(tail -n 250 "$RUNNER_TEMP/gradle-build.log" | gzip -c | base64 -w0 | fold -w 3500 | awk '1')
            exit 1
          fi

      - name: Upload Android release files
        uses: actions/upload-artifact@v6
        with:
          name: android-release-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
